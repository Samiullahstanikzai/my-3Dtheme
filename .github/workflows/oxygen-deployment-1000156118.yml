name: Storefront 1000156118
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish to Oxygen
        shell: bash
        run: |
          deploy_log_file="$(mktemp)"
          trap 'rm -f "$deploy_log_file"' EXIT

          set +e
          npx shopify hydrogen deploy 2>&1 | tee "$deploy_log_file"
          deploy_exit_code=${PIPESTATUS[0]}
          set -e

          if [ "$deploy_exit_code" -eq 0 ]; then
            exit 0
          fi

          if node scripts/is-known-oxygen-auth-failure.mjs < "$deploy_log_file"; then
            echo "::warning::Detected known Oxygen BuildInitiate 401 auth failure; skipping failure."
            exit 0
          fi

          exit "$deploy_exit_code"
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000156118 }}

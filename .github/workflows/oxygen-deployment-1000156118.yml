name: Storefront 1000156118
on: [push]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Oxygen
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          check-latest: true

      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish to Oxygen
        id: oxygen_deploy
        continue-on-error: true
        run: |
          set +e
          deploy_output="$(npx shopify hydrogen deploy 2>&1)"
          deploy_status=$?
          set -e

          echo "$deploy_output"
          echo "deploy_status=$deploy_status" >> "$GITHUB_OUTPUT"

          if [ "$deploy_status" -eq 0 ]; then
            echo "known_auth_failure=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          known_auth_failure="$(
            echo "$deploy_output" | awk '
              /GraphQL Error \(Code: 401\)/ {window=20; next}
              window > 0 {
                if (/mutation BuildInitiate/) {
                  print "yes"
                  exit
                }
                window--
              }
            '
          )"

          if [ "$known_auth_failure" = "yes" ]; then
            echo "known_auth_failure=yes" >> "$GITHUB_OUTPUT"
          else
            echo "known_auth_failure=no" >> "$GITHUB_OUTPUT"
          fi
          exit "$deploy_status"
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN_1000156118 }}

      - name: Handle deployment result
        if: ${{ steps.oxygen_deploy.outcome == 'failure' }}
        run: |
          if [ "${{ steps.oxygen_deploy.outputs.known_auth_failure }}" = "yes" ]; then
            echo "::warning::Oxygen deployment failed with GraphQL 401. Refresh OXYGEN_DEPLOYMENT_TOKEN_1000156118 in repository secrets."
            exit 0
          fi

          echo "::error::Oxygen deployment failed with exit status ${{ steps.oxygen_deploy.outputs.deploy_status }} for a reason other than the known GraphQL 401 auth issue. See deploy step logs above for details."
          exit 1
